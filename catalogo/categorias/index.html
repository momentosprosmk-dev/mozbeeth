<!-- index.html | Catálogo de Beats & Categorías - MOZBEETH -->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Beats - MOZBEETH Music Producer</title>
  <meta name="description" content="Explora y escucha el catálogo de instrumentales de Mozbeeth: Reggaetón, Trap, R&B, Afro y Synthwave con entrega inmediata." />
  <link rel="icon" href="/recursos/media/global/logo_mozbeeth.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <!-- CSS Global -->
  <link rel="stylesheet" href="/recursos/css/global/base.css" />
  <link rel="stylesheet" href="/recursos/css/global/header.css" />
  <link rel="stylesheet" href="/recursos/css/global/footer.css" />
  <link rel="stylesheet" href="/recursos/css/global/scrollVertical.css" />
  <!-- CSS Catálogo Separado (<= 1024px Movil | >= 1024px PC) -->
  <link rel="stylesheet" href="/recursos/css/catalogo/movil.css" />
  <link rel="stylesheet" href="/recursos/css/catalogo/pc.css" />
</head>

<body>
  <!-- Header | General -->
  <header class="header">
    <div class="logo">
      <a href="/"><img src="/recursos/media/global/logo_mozbeeth.svg" alt="Logo Mozbeeth" /></a>
    </div>
    <nav class="nav">
      <ul>
        <li><a href="/">INICIO</a></li>
        <li><a href="/catalogo/categorias/" class="active">BEATS</a></li>
        <li><a href="/servicios/">SERVICIOS</a></li>
        <li><a href="/estudio/">SOBRE MÍ</a></li>
        <li><a href="/formularios/cotizar/">CONTACTO</a></li>
      </ul>
    </nav>
    <div class="header-right-pc">
      <a href="/formularios/cotizar/" class="btn-header-cta">TRABAJA CONMIGO</a>
    </div>
    <button id="btn-menu" class="menu-btn no-active" aria-label="Menú">☰</button>
  </header>

  <section class="section-scroll catalogo-page-scroll">
    <div class="beats-section-header">
      <h2>CATÁLOGO DE BEATS</h2>
    </div>

    <!-- Filtros rápidos por estilo -->
    <div class="filter-tabs">
      <button class="filter-btn" data-filter="all">Todos</button>
      <button class="filter-btn" data-filter="trap">Trap / Drill</button>
      <button class="filter-btn" data-filter="reggaeton">Urbano / Lo-Fi</button>
      <button class="filter-btn" data-filter="rnb">R&amp;B</button>
      <button class="filter-btn" data-filter="synthwave">Synth / Pop</button>
    </div>

    <!-- Vista PC (>= 1024px): Tarjetas de 3 columnas + Panel Beat Destacado -->
    <div class="beats-pc-grid js-beats-pc-grid"></div>
    <div id="featured-beat-container"></div>

    <!-- Vista Móvil (<= 1024px): Lista compacta de Beats -->
    <div class="beats-movil-list js-beats-movil-list"></div>
  </section>

  <div id="overlay" class="overlay"></div>
  <div id="menu-container"></div>
  <div id="reproductor-container"></div>

  <footer>
    <section class="footer-movil">
      <a href="/" class="btn-footer">⌂ Inicio</a>
      <a href="/formularios/cotizar/" class="btn-footer btn-footer-alt">💬 Cotizar</a>
    </section>
    <div id="footer-pc"></div>
  </footer>

  <script src="/recursos/js/global/gateway.js"></script>
  <script src="/recursos/js/global/copyright.js"></script>
  <script src="/recursos/js/desplegable/modulesMenu.js"></script>
  <script src="/recursos/js/desplegable/menuLoader.js"></script>
  <script src="/recursos/js/global/audioEngine.js"></script>
  <script src="/recursos/js/catalogo/catalogo.js"></script>
</body>
</html>
